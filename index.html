// --- Gemini API Helper ---
async function callGemini(prompt, retries = 3, delay = 1000) {
    const apiKey = ""; // Left empty as per instructions
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
    const payload = { contents: [{ parts: [{ text: prompt }] }] };

    for (let i = 0; i < retries; i++) {
        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const result = await response.json();
            
            if (result.candidates && result.candidates.length > 0 &&
                result.candidates[0].content && result.candidates[0].content.parts &&
                result.candidates[0].content.parts.length > 0 &&
                result.candidates[0].content.parts[0].text) {
                return result.candidates[0].content.parts[0].text;
            } else {
                 console.error("Invalid response structure from Gemini API. Full response:", result);
                 throw new Error("Invalid response structure from Gemini API");
            }
        } catch (error) {
            console.error(`Attempt ${i + 1} failed:`, error);
            if (i < retries - 1) {
                await new Promise(res => setTimeout(res, delay));
                delay *= 2;
            } else {
                return "Sorry, de AI-assistent is momenteel niet beschikbaar.";
            }
        }
    }
}

// --- Initialisatie ---
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('investor-pitch-screen').innerHTML = templates.investorPitch;
    document.getElementById('insurer-pitch-screen').innerHTML = templates.insurerPitch;
    document.getElementById('ai-summary-modal').innerHTML = templates.aiSummaryModal;
    document.getElementById('action-plan-modal').innerHTML = templates.actionPlanModal;
    document.getElementById('ai-logopedist-modal').innerHTML = templates.aiLogopedistModal;
    document.getElementById('ai-tip-modal').innerHTML = templates.aiTipModal;
    document.getElementById('ai-kennis-modal').innerHTML = templates.aiKennisModal;
    resetState();
});


// --- Scherm Navigatie ---
function showScreen(screenId) {
    ['login-screen', 'app-screen', 'investor-pitch-screen', 'insurer-pitch-screen'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
    });
    document.getElementById(screenId).classList.remove('hidden');
}
function showLoginScreen() { showScreen('login-screen'); }
function showInvestorPitch() { showScreen('investor-pitch-screen'); }
function showInsurerPitch() { showScreen('insurer-pitch-screen'); }

// --- Authenticatie & UI Rendering ---
function loginAs(role) {
    resetState();
    appState.currentUserRole = role;
    showScreen('app-screen');
    const indicator = document.getElementById('role-indicator');
    indicator.textContent = role.charAt(0).toUpperCase() + role.slice(1);
    const roleColors = { 'gebruiker': 'bg-emerald-900 text-emerald-200', 'thuisfront': 'bg-sky-900 text-sky-200', 'zorgprofessional': 'bg-indigo-900 text-indigo-200' };
    indicator.className = `text-sm font-semibold px-3 py-1 rounded-full ${roleColors[role]}`;
    renderModules();
}

function logout() {
    appState.currentUserRole = null;
    showLoginScreen();
}

function renderModules() {
    const mainContent = document.getElementById('main-content');
    mainContent.innerHTML = modules[appState.currentUserRole] || '<p>Geen weergave voor deze rol.</p>';
    updateUI();
}

function updateUI() {
    const role = appState.currentUserRole;
    if (role === 'gebruiker') {
        renderBehandelplan('plan-hoofddoel', 'plan-progress', 'plan-acties');
        renderOorzakenEnWensen();
        const triggerInput = document.getElementById('wens-trigger-input');
        if (triggerInput) {
            triggerInput.addEventListener('input', (e) => generateWensSuggestion(e.target.value));
        }
    } else if (role === 'thuisfront') {
        renderRapportages();
        renderWensenReadOnly();
    } else if (role === 'zorgprofessional') {
        renderPatientenDashboard();
    }
}

// --- Specifieke UI Render Functies ---
function renderBehandelplan(hoofddoelId, progressId, actiesId) {
    const hoofddoelEl = document.getElementById(hoofddoelId);
    const progressEl = document.getElementById(progressId);
    const actiesContainer = document.getElementById(actiesId);
    if (!hoofddoelEl || !progressEl || !actiesContainer) return;

    hoofddoelEl.textContent = appState.behandelplan.hoofddoel;
    const completed = appState.behandelplan.acties.filter(a => a.completed).length;
    const total = appState.behandelplan.acties.length;
    const percentage = total > 0 ? (completed / total) * 100 : 0;
    progressEl.style.width = `${percentage}%`;

    actiesContainer.innerHTML = appState.behandelplan.acties.map(actie => `
        <div class="flex items-center bg-white/5 p-2 rounded-md">
            <input type="checkbox" id="actie-${actie.id}" ${actie.completed ? 'checked' : ''} onchange="toggleActie(${actie.id})" class="mr-3 h-5 w-5 rounded text-emerald-400 bg-transparent border-gray-500 focus:ring-emerald-500">
            <label for="actie-${actie.id}" class="${actie.completed ? 'line-through text-gray-500' : 'text-text-light'}">${actie.text}</label>
        </div>
    `).join('');
}

function renderPatientenDashboard() {
    const container = document.getElementById('patienten-lijst');
    if (!container) return;
    container.innerHTML = appState.patienten.map(p => `
        <div class="bg-white/5 p-3 rounded-md shadow-sm hover:bg-white/10 transition-all cursor-pointer" onclick="alert('Patiëntdossier voor ${p.naam} openen (simulatie)')">
            <div class="flex justify-between items-center">
                <p class="font-bold text-text-light">${p.naam}</p>
                <span class="text-xs text-gray-400">${p.laatsteUpdate}</span>
            </div>
            <div class="w-full progress-bar h-2 mt-2"><div class="progress-bar-fill" style="width: ${p.voortgang}%"></div></div>
        </div>
    `).join('');
}

function renderOorzakenEnWensen() {
    const container = document.getElementById('wensen-lijst');
    if (!container) return;
    container.innerHTML = appState.oorzakenEnWensen.map(item => `
        <div class="bg-white/5 p-3 rounded-lg">
            <p class="text-sm font-semibold">Wanneer: <span class="font-normal text-gray-300">${item.trigger}</span></p>
            <p class="text-sm font-semibold mt-1">Dan heb ik nodig: <span class="font-normal text-gray-300">${item.wens}</span></p>
        </div>
    `).join('');
}

function renderRapportages() {
    const container = document.getElementById('rapportages-lijst');
    if (!container) return;
    if (appState.rapportages.length === 0) {
        container.innerHTML = `<p class="text-sm text-gray-400">Er zijn nog geen rapportages gedeeld.</p>`;
        return;
    }
    container.innerHTML = appState.rapportages.map(rapport => `
        <div class="bg-white/5 p-3 rounded-lg">
            <p class="text-xs text-gray-400 mb-1">Gedeeld op ${rapport.datum}</p>

        </div>
    `).join('');
}

function renderWensenReadOnly() {
    const container = document.getElementById('wensen-lijst-read-only');
    if (!container) return;
    container.innerHTML = appState.oorzakenEnWensen.map(item => `
        <div class="bg-yellow-500/10 p-3 rounded-lg border-l-4 border-yellow-400">
            <p class="text-sm font-semibold">Wanneer: <span class="font-normal text-gray-300">${item.trigger}</span></p>
            <p class="text-sm font-semibold mt-1">Dan is de wens: <span class="font-normal text-gray-300">${item.wens}</span></p>

// --- Acties & Interacties ---
function toggleActie(id) {
    const actie = appState.behandelplan.acties.find(a => a.id === id);
    if (actie) {
        actie.completed = !actie.completed;
        updateUI();
    }
}

function addOorzaakEnWens() {
    const triggerInput = document.getElementById('wens-trigger-input');
    const wensInput = document.getElementById('wens-wens-input');
    const trigger = triggerInput.value.trim();
    const wens = wensInput.value.trim();
    if (trigger === '' || wens === '') return;
    appState.oorzakenEnWensen.unshift({ trigger, wens });
    triggerInput.value = '';
    wensInput.value = '';
    document.getElementById('wens-suggestion-container').innerHTML = '';
    updateUI();
}

function shareSummary() {
    const now = new Date();
    const formattedDate = `${now.getDate()}-${now.getMonth()+1}-${now.getFullYear()}`;
    const formattedSummary = appState.currentSummary
        .replace(/<h3[^>]*>/g, '<strong>').replace(/<\/h3> /g, '</strong><br>')
        .replace(/<p[^>]*>/g, '').replace(/<\/p>/g, '<br>');

    appState.rapportages.unshift({
        datum: formattedDate,
        samenvatting: formattedSummary
    });
    alert('Rapportage gedeeld met thuisfront!');
    closeModal('ai-summary-modal');
}


// --- Gemini-Powered Functies ---
async function generateAiSummary() {
    openModal('ai-summary-modal');
    const loader = document.getElementById('ai-summary-loader');
    const content = document.getElementById('ai-summary-content');
    
    if (!loader || !content) {
        console.error("Modal elements for AI Summary not found in DOM.");
        closeModal('ai-summary-modal');
        return;
    }

    loader.classList.remove('hidden');
    content.innerHTML = '';

    const mockTranscript = "Arts: Goedemorgen Paul, hoe gaat het met de vermoeidheid en de hoofdpijn waar we het vorige keer over hadden? Patiënt: Het gaat wisselend. Soms heb ik een goede dag, maar na een drukke ochtend ben ik 's middags helemaal op en krijg ik snel hoofdpijn. Vooral in de supermarkt is het lastig. Arts: Dat klinkt inderdaad als overprikkeling. Het is belangrijk om je energie beter te verdelen. We moeten concrete stappen zetten om te voorkomen dat je over je grenzen gaat. Laten we een paar actiepunten afspreken. We zien elkaar over drie weken weer om te kijken hoe het gaat.";
    const prompt = `Vat het volgende gesprek tussen een arts en een patiënt met NAH kort en bondig samen. Structureer de output in de volgende secties: 'Belangrijkste Klacht', 'Conclusie Arts', en 'Voorgesteld Actiepunt'. Gebruik duidelijke en eenvoudige taal. Gesprek: "${mockTranscript}"`;
    
    const summary = await callGemini(prompt);
    appState.currentSummary = summary;
    loader.classList.add('hidden');
    
    const formattedSummary = summary
        .replace(/Belangrijkste Klacht:/g, '<h3 class="font-semibold text-gray-800">Belangrijkste Klacht:</h3><p class="mb-2 text-gray-600">')
        .replace(/Conclusie Arts:/g, '</p><h3 class="font-semibold text-gray-800">Conclusie Arts:</h3><p class="mb-2 text-gray-600">')
        .replace(/Voorgesteld Actiepunt:/g, '</p><h3 class="font-semibold text-gray-800">Voorgesteld Actiepunt:</h3><p class="text-gray-600">') + '</p>';
    content.innerHTML = formattedSummary;

    const buttonsContainer = document.createElement('div');
    if (appState.currentUserRole === 'zorgprofessional') {
        buttonsContainer.innerHTML = `<button onclick="openActionPlanCreator()" class="w-full mt-4 bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg">✨ Maak Behandelplan met AI</button>`;
    } else {
        buttonsContainer.innerHTML = `<button onclick="shareSummary()" class="w-full mt-4 bg-sky-500 text-white font-bold py-2 px-4 rounded-lg">Deel met Thuisfront</button>`;
    }
    content.appendChild(buttonsContainer);
}

async function generateWensSuggestion(triggerText) {
    const container = document.getElementById('wens-suggestion-container');
    if (!triggerText || triggerText.length < 5) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = `<p class="text-xs text-gray-400">✨ AI denkt mee over een wens...</p>`;
    const prompt = `Een persoon met NAH beschrijft een situatie die overprikkeling kan veroorzaken: "${triggerText}". Wat zou een goede, concrete wens of behoefte kunnen zijn in die situatie? Geef één korte, duidelijke suggestie in de 'ik'-vorm. Bijvoorbeeld: "Ik heb dan even rust nodig." of "Kun je me dan helpen met...?". Geef alleen de wens, zonder extra tekst.`;
    const suggestion = await callGemini(prompt);
    container.innerHTML = `
        <div class="flex flex-wrap gap-2">
            <button class="suggestion-chip bg-emerald-800 text-emerald-200 text-sm font-medium px-3 py-1 rounded-full hover:bg-emerald-700" onclick="useWensSuggestion('${suggestion}')">
                Suggestie: ${suggestion}
            </button>
        </div>`;
}

function useWensSuggestion(suggestion) {
    document.getElementById('wens-wens-input').value = suggestion;
}

async function openActionPlanCreator() {
    closeModal('ai-summary-modal');
    openModal('action-plan-modal');
    const hoofddoelInput = document.getElementById('hoofddoel-input');
    const actiepuntenContainer = document.getElementById('actiepunten-container');
    const suggestionsContainer = document.getElementById('ai-plan-suggestions');
    
    hoofddoelInput.value = '';
    actiepuntenContainer.innerHTML = '';
    suggestionsContainer.innerHTML = `<p class="text-xs text-gray-500">✨ AI genereert suggesties voor actiepunten...</p>`;

    const prompt = `Gebaseerd op de volgende samenvatting van een medisch gesprek: "${appState.currentSummary}", stel 3 concrete en haalbare actiepunten voor in een behandelplan voor een patiënt met NAH. Formuleer ze als taken die de patiënt kan uitvoeren. Geef alleen de taken, elk op een nieuwe regel, zonder nummering of aanhalingstekens.`;
    const suggestionsText = await callGemini(prompt);
    const suggestions = suggestionsText.split('\n').filter(s => s.trim() !== '');
    
    suggestions.forEach(s => addActiepuntInput(s)); // Add suggestions directly
    hoofddoelInput.value = "Energie en prikkels beter leren managen."; // Suggest a main goal

    suggestionsContainer.innerHTML = ``; // Clear suggestions as they are now in the list
}

function addActiepuntInput(value = '') {
    const container = document.getElementById('actiepunten-container');
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'w-full border p-2 rounded-md bg-white text-black';
    input.placeholder = 'Nieuw actiepunt';
    input.value = value;
    container.appendChild(input);
}

function saveBehandelplan() {
    const hoofddoel = document.getElementById('hoofddoel-input').value;
    const actiepuntenInputs = document.querySelectorAll('#actiepunten-container input');
    const acties = Array.from(actiepuntenInputs).map((input, index) => ({
        id: Date.now() + index, // unique id
        text: input.value,
        completed: false
    }));

    appState.behandelplan = { hoofddoel, acties };
    
    alert('Behandelplan opgeslagen en toegewezen aan Paul Evers!');
    closeModal('action-plan-modal');
    updateUI(); // Update the UI immediately for all roles
}

// --- AI Logopedist Functies ---
function startSpeechTherapy() {
    openModal('ai-logopedist-modal');
    document.getElementById('logopedist-oefening-container').classList.remove('hidden');
    document.getElementById('logopedist-feedback-container').classList.add('hidden');
    document.getElementById('logopedist-feedback-content').classList.add('hidden');
    
    const zinnen = ["De kat krabt de krullen van de trap.", "Achtentachtig prachtige grachten.", "Drie dikke draden."];
    const oefenzin = zinnen[Math.floor(Math.random() * zinnen.length)];
    document.getElementById('logopedist-oefenzin').textContent = oefenzin;
}

async function recordAndGetFeedback() {
    document.getElementById('logopedist-oefening-container').classList.add('hidden');
    const feedbackContainer = document.getElementById('logopedist-feedback-container');
    feedbackContainer.classList.remove('hidden');
    
    const loader = document.getElementById('logopedist-loader');
    const content = document.getElementById('logopedist-feedback-content');

    if (!loader || !content) {
        console.error("Modal elements for AI Logopedist not found in DOM.");
        closeModal('ai-logopedist-modal');
        return;
    }

    loader.classList.remove('hidden');
    content.classList.add('hidden');

    const oefenzin = document.getElementById('logopedist-oefenzin').textContent;
    const mockAttempt = "De kat kabt de kullen van de tap."; // Gesimuleerde foute uitspraak

    const prompt = `Je bent een vriendelijke en ondersteunende AI-logopedist. Een patiënt met NAH heeft de zin '${oefenzin}' proberen uit te spreken. Hun (gesimuleerde) poging klinkt als '${mockAttempt}'. Geef korte, positieve feedback en één concrete tip voor verbetering. Spreek direct tegen de patiënt. Formatteer de output met een <strong> voor de tip.`;

    const feedback = await callGemini(prompt);
    
    loader.classList.add('hidden');
    content.innerHTML = `<p>${feedback}</p>`;
    content.classList.remove('hidden');
}

// --- Nieuwe AI Functies ---
function logMood(mood, emoji) {
    const feedbackDiv = document.getElementById('mood-feedback');
    feedbackDiv.innerHTML = `<p class="text-sm text-gray-300 mt-4">Je voelt je ${mood.toLowerCase()} ${emoji}.</p>
                             <button onclick="generateMoodTip('${mood}')" class="mt-2 text-sm text-sky-400 hover:underline">✨ Krijg een tip van de AI</button>`;
}

async function generateMoodTip(mood) {
    openModal('ai-tip-modal');
    const loader = document.getElementById('ai-tip-loader');
    const content = document.getElementById('ai-tip-content');
    loader.style.display = 'block';
    content.style.display = 'none';

    const prompt = `Ik voel me '${mood}'. Ik heb niet-aangeboren hersenletsel (NAH). Geef me één simpele, zachte en direct uitvoerbare tip om mijn welzijn te verbeteren. Houd het laagdrempelig en prikkelarm. Spreek me direct aan.`;
    const tip = await callGemini(prompt);

    content.innerHTML = `<p class="text-center text-gray-700">${tip}</p>`;
    loader.style.display = 'none';
    content.style.display = 'block';
}

async function getAIKnowledgeAnswer() {
    const input = document.getElementById('kennis-input');
    const question = input.value.trim();
    if (question === '') return;

    openModal('ai-kennis-modal');
    const loader = document.getElementById('ai-kennis-loader');
    const content = document.getElementById('ai-kennis-content');
    loader.classList.remove('hidden');
    content.innerHTML = '';

    const prompt = `Je bent een behulpzame assistent voor mensen met niet-aangeboren hersenletsel (NAH) en hun families. Beantwoord de volgende vraag in eenvoudige, duidelijke en geruststellende taal. Houd het antwoord kort en gebruik, indien mogelijk, opsommingstekens. Vraag: "${question}"`;
    const answer = await callGemini(prompt);

    loader.classList.add('hidden');
    content.innerHTML = `<p class="text-gray-700">${answer.replace(/\n/g, '<br>')}</p>`;
}


// --- Modal Functies ---
function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

</script>
