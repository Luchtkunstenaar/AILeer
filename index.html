        :root {

            --text-color: #E6F1FF;
            --text-color-secondary: #8A9CB1;
            --card-bg: #10171F;
            --border-color: #2C3A4B;
            --success-color: #238636;
            --error-color: #da3633;
            --shadow-light: rgba(0, 152, 234, 0.25);
            --shadow-dark: rgba(0, 152, 234, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            cursor: grab;
        }

        #language-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 15, 20, 0.9);
            backdrop-filter: blur(15px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.5s ease, visibility 0.5s;
            opacity: 1;
            visibility: visible;
        }
        
        #language-modal.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        #language-modal h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        #language-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            max-width: 600px;
            width: 90%;
        }

        .lang-select-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 1.5rem 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .lang-select-btn:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 5px 20px var(--shadow-dark);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 4rem 0;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-color);
            box-shadow: 0 0 35px var(--shadow-light);
            text-shadow: 0 0 15px var(--shadow-light);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: -webkit-linear-gradient(45deg, #FFF, #0098EA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            color: var(--text-color-secondary);
        }

        .info-section {
            padding: 2rem 0;
        }

        h2 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #FFF;
            position: relative;
        }

        h2::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            margin: 0.5rem auto 0;
            border-radius: 2px;
        }
        
        #checklist-instruction {
            text-align: center;
            color: var(--text-color-secondary);
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .feature-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
            cursor: pointer;
            opacity: 0.7;
            display: flex;
            flex-direction: column;
        }
        
        .feature-card.checked {
            opacity: 1;
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2), 0 0 15px var(--shadow-dark);
        }
        
        .feature-card h3 {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
        }
        
        .feature-card p {
            flex-grow: 1;
            color: var(--text-color-secondary);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            margin-right: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox svg {
            width: 14px;
            height: 14px;
            stroke: #fff;
            stroke-width: 3;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }
        
        .feature-card.checked .checkbox {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }

        .feature-card.checked .checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .quiz-cta {
            text-align: center;
            padding: 3rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .quiz-cta p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .quiz-cta p strong {
             color: #fff;
        }

        .btn {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #007ecc;
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--shadow-light);
        }

        .btn:disabled {
            background: #30363d;
            color: #8b949e;
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }

        #quiz-section, #results-section {
            display: none;
            padding: 3rem 0;
        }

        .quiz-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        #question-container {
            margin-bottom: 2rem;
        }

        #question-text {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .option-btn {
            width: 100%;
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 1rem;
            text-align: left;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: var(--shadow-dark);
        }
        
        .option-btn.correct { background-color: var(--success-color); border-color: var(--success-color); color: #fff; }
        .option-btn.wrong { background-color: var(--error-color); border-color: var(--error-color); color: #fff; }
        
        #progress-text { text-align: center; margin-top: 2rem; font-weight: 500; }

        .certificate {
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 0 30px var(--shadow-light);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        
        .certificate::before {
            content: 'MW';
            position: absolute;
            top: -20px;
            left: -20px;
            font-size: 10rem;
            font-weight: 900;
            color: rgba(0, 152, 234, 0.05);
            z-index: 0;
            transform: rotate(-20deg);
        }

        .certificate-content { position: relative; z-index: 1; }
        #certificate-title { font-size: 2.5rem; font-weight: 900; color: var(--primary-color); }
        #final-score { font-size: 1.8rem; margin: 1rem 0; }
        #motivational-text { font-size: 1.2rem; color: var(--text-color-secondary); margin-bottom: 2rem; font-style: italic; }
        #peaceman-proud-text { margin-bottom: 2.5rem; font-weight: 500; }

        .social-share {
            margin-top: 2rem;
            background: rgba(10, 15, 20, 0.5);
            padding: 2rem;
            border-radius: 8px;
        }
        
        .social-share h3 { color: #FFF; margin-bottom: 1.5rem; }
        .input-group { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; align-items: center; justify-content: center; }
        .input-group input { background: var(--background-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 0.8rem; border-radius: 6px; font-size: 1rem; flex-grow: 1; min-width: 200px; }
        .social-share p { font-size: 0.9rem; max-width: 500px; margin: 0 auto 1rem auto; line-height: 1.5; }
        .contest-disclaimer { font-size: 0.8rem !important; color: var(--text-color-secondary); margin-top: 1.5rem !important; }

        footer {
            text-align: center;
            padding: 4rem 2rem 2rem 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
        }
        
        .official-channels { margin-bottom: 2rem; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1rem;}
        .footer-credit { font-size: 0.9rem; color: var(--text-color-secondary); }
        .footer-credit a { color: var(--primary-color); text-decoration: none; }
        .footer-credit a:hover { text-decoration: underline; }

    </style>
</head>

    // --- 3D Background Setup ---
    let scene, camera, renderer, particles;
    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const particleCount = 7000;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 20;
        }
        
        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const primaryColorValue = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim();
        const particlesMaterial = new THREE.PointsMaterial({
            color: new THREE.Color(primaryColorValue),
            size: 0.02,
            map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png'),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);
        
        camera.position.z = 5;
        
        document.addEventListener('mousemove', onDocumentMouseMove, false);
        animate3D();
    }

    function onDocumentMouseMove(event) {
        mouseX = (event.clientX - window.innerWidth / 2) / 200;
        mouseY = (event.clientY - window.innerHeight / 2) / 200;
    }

    function animate3D() {
        requestAnimationFrame(animate3D);
        
        camera.position.x += (mouseX - camera.position.x) * 0.02;
        camera.position.y += (-mouseY - camera.position.y) * 0.02;
        camera.lookAt(scene.position);

        particles.rotation.y += 0.0002;
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Language & Content Functions ---
    function selectLanguage(lang) {
        currentLang = lang;
        document.documentElement.lang = lang;
        
        languageModal.classList.add('hidden');
        mainContainer.style.opacity = '1';

        updateAllText();
        populateFeatures();
        checkChecklistCompletion();
    }

    function updateAllText() {
        const langData = translations[currentLang];
        document.querySelectorAll('[data-key]').forEach(element => {
            const key = element.dataset.key;
            if (langData && langData[key]) {
                element.innerHTML = langData[key];
            }
        });
        
        document.querySelectorAll('[data-placeholder-key]').forEach(element => {
            const key = element.dataset.placeholderKey;
             if (langData && langData[key]) {
                element.placeholder = langData[key];
            }
        });
    }

    function populateLanguageSelector() {
        for (const [code, name] of Object.entries(supportedLangs)) {
            const button = document.createElement('button');
            button.className = 'lang-select-btn';
            button.textContent = name;
            button.dataset.lang = code;
            button.addEventListener('click', () => selectLanguage(code));
            languageGrid.appendChild(button);
        }
    }
    
    function populateFeatures() {
        featuresGrid.innerHTML = '';
        const langFeatures = translations[currentLang].features;
        langFeatures.forEach(feature => {
            const card = document.createElement('div');
            card.className = 'feature-card';
            card.dataset.featureKey = feature.key;
            card.innerHTML = `
                <h3>
                    <span class="checkbox">
                        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </span>
                    <span>${feature.title}</span>
                </h3>
                <p>${feature.desc}</p>
            `;
            featuresGrid.appendChild(card);
            card.addEventListener('click', () => {
                card.classList.toggle('checked');
                checkChecklistCompletion();
            });
        });
    }

    function checkChecklistCompletion() {
        const cards = document.querySelectorAll('.feature-card');
        const checkedCards = document.querySelectorAll('.feature-card.checked');
        if (cards.length > 0 && cards.length === checkedCards.length) {
            startQuizBtn.disabled = false;
        } else {
            startQuizBtn.disabled = true;
        }
    }

    function showQuestion() {
        resetState();
        const langQuestions = translations[currentLang].quizQuestions;
        const question = langQuestions[currentQuestionIndex];
        
        questionText.innerText = question.question;
        progressText.innerText = translations[currentLang].quiz_progress
            .replace('{current}', currentQuestionIndex + 1)
            .replace('{total}', langQuestions.length);

        question.options.forEach(option => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.addEventListener('click', (e) => selectAnswer(e));
            optionsContainer.appendChild(button);
        });
    }

    function resetState() {
        while (optionsContainer.firstChild) {
            optionsContainer.removeChild(optionsContainer.firstChild);
        }
    }

    function selectAnswer(e) {

        if (correct) {
            score++;
            selectedBtn.classList.add('correct');
        } else {
            selectedBtn.classList.add('wrong');
        }
        
        Array.from(optionsContainer.children).forEach(button => {
            if (button.innerText === langQuestions[currentQuestionIndex].answer) {
                 button.classList.add('correct');
            }
            button.disabled = true;
        });

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < langQuestions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }, 1500);
    }

    function showResults() {
        quizSection.style.display = 'none';
        resultsSection.style.display = 'block';
        window.scrollTo({ top: resultsSection.offsetTop - 100, behavior: 'smooth' });

        const langQuestions = translations[currentLang].quizQuestions;
        const finalScoreEl = document.getElementById('final-score');
        const motivationalTextEl = document.getElementById('motivational-text');

        finalScoreEl.innerText = translations[currentLang].quiz_score_text
            .replace('{score}', score)
            .replace('{total}', langQuestions.length);

        let messageKey = 0;
        if (score === 5) messageKey = 5;
        else if (score >= 3) messageKey = 3;
        else if (score >= 1) messageKey = 1;
        
        motivationalTextEl.innerText = translations[currentLang].motivational[messageKey];
    }

    // --- Event Listeners ---
    startQuizBtn.addEventListener('click', () => {
        currentQuestionIndex = 0;
        score = 0;
        quizCtaSection.style.display = 'none';
        resultsSection.style.display = 'none';
        quizSection.style.display = 'block';
        window.scrollTo({ top: quizSection.offsetTop - 100, behavior: 'smooth' });
        showQuestion();
    });
    
    repostBtn.addEventListener('click', () => {
        const twitterHandle = twitterHandleInput.value.trim();
        if (twitterHandle === "") {
            twitterHandleInput.style.borderColor = 'var(--error-color)';
            setTimeout(() => { twitterHandleInput.style.borderColor = 'var(--border-color)'; }, 2000);
            return;
        }
        const certificateTitle = translations[currentLang].certificate_title;
        const text = translations[currentLang].repost_tweet.replace('{certificateTitle}', certificateTitle);
        const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
        window.open(twitterUrl, '_blank');
    });

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        init3D();
        populateLanguageSelector();
        document.querySelector('#language-modal h1').innerText = translations.en.language_select_title;
    });

    </script>
</body>
</html>
